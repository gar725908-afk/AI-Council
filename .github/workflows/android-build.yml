name: Android validation

on:
  push:
    branches:
      - "nexus/**"
  pull_request:
    paths:
      - "android/OllamaHybrid/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

# Keep only the newest validation active for each branch.
concurrency:
  group: nexus-android-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble debug APK
        working-directory: android/OllamaHybrid
        run: gradle --no-daemon :app:assembleDebug
      # Unit and device testing are intentionally deferred to the next NEXUS phase.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: android/OllamaHybrid/app/build/outputs/apk/debug/*.apk
