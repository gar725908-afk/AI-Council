name: NEXUS Android Debug APK

on:
  push:
    branches:
      - nexus/genesis-foundation
    paths:
      - "android/OllamaHybrid/**"
      - ".github/workflows/nexus-android-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build NEXUS debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android build packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 2 -maxdepth 2 -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Build debug APK
        working-directory: android/OllamaHybrid
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          test -s android/OllamaHybrid/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/OllamaHybrid/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-debug-apk
          path: android/OllamaHybrid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
