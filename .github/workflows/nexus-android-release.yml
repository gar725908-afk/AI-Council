name: NEXUS Android Release

on:
  push:
    tags:
      - "nexus-v*"

permissions:
  contents: write

concurrency:
  group: nexus-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build, verify and publish signed NEXUS APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          VERSION="\${GITHUB_REF_NAME#nexus-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must have the form nexus-vMAJOR.MINOR.PATCH (for example nexus-v0.6.1)."
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "::error::Generated Android versionCode is out of range."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "NEXUS_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "NEXUS_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Prepare Android upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXUS_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEXUS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUS_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUS_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing NEXUS_ANDROID_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing NEXUS_ANDROID_KEYSTORE_PASSWORD repository secret."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing NEXUS_ANDROID_KEY_ALIAS repository secret."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing NEXUS_ANDROID_KEY_PASSWORD repository secret."; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/nexus-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "NEXUS_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "NEXUS_SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NEXUS_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NEXUS_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests and build signed release
        working-directory: android/OllamaHybrid
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:bundleRelease :app:assembleRelease

      - name: Verify APK and create checksum
        shell: bash
        run: |
          APK="android/OllamaHybrid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"
          ls -lh "$APK" "$APK.sha256"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Android-${{ steps.version.outputs.version }}
          path: |
            android/OllamaHybrid/app/build/outputs/apk/release/app-release.apk
            android/OllamaHybrid/app/build/outputs/apk/release/app-release.apk.sha256
            android/OllamaHybrid/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NEXUS Android ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            android/OllamaHybrid/app/build/outputs/apk/release/app-release.apk
            android/OllamaHybrid/app/build/outputs/apk/release/app-release.apk.sha256
            android/OllamaHybrid/app/build/outputs/bundle/release/app-release.aab
